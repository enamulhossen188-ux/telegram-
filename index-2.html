<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#229ED9">
  <meta name="description" content="Join Bachelor Point Season 5 on Telegram">
  <title>Bachelor Point Season 5</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: linear-gradient(135deg, #e8f7ff, #f5fbff);
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 22px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
    }

    .logo {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 18px;
      border: 4px solid #e5f5fc;
    }

    h1 {
      font-size: 27px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.7;
      color: #4b5563;
      margin-bottom: 24px;
    }

    .telegram-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      padding: 15px 20px;
      border-radius: 16px;
      background: #229ED9;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 7px 18px rgba(34, 158, 217, 0.28);
      transition: transform .15s ease, background .15s ease;
    }

    .telegram-btn:active {
      transform: scale(.98);
    }

    .telegram-btn:hover {
      background: #168dcc;
    }

    .telegram-icon {
      font-size: 25px;
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
    }

    .fallback {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.6;
      color: #374151;
    }

    .fallback a {
      color: #168dcc;
      font-weight: 700;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      class="logo"
      src="https://telegram.org/img/t_logo.png"
      alt="Telegram"
    >

    <h1>Bachelor Point Season 5</h1>

    <p class="subtitle">
      Bachelor Point Season 5-এর নতুন আপডেট ও কনটেন্ট পেতে আমাদের Telegram Channel-এ যোগ দিন।
    </p>

    <a
      class="telegram-btn"
      href="https://t.me/bachelorpointweb"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="telegram-icon">✈</span>
      OPEN TELEGRAM
    </a>

    <p class="note">
      বাটনে চাপ দেওয়ার পর Telegram App না খুললে উপরের ব্রাউজারের
      “Open in browser” অপশন ব্যবহার করুন।
    </p>

    <div class="fallback">
      Direct link:<br>
      <a href="https://t.me/bachelorpointweb">
        https://t.me/bachelorpointweb
      </a>
    </div>
  </main>
</body>
</html>
